name: CI

on:
  push:
    branches: [main, alpha, dev]
  pull_request:
    # Every branch the flow protects, so that a required check is never one that had no reason to run.
    branches: [main, alpha, dev]
  schedule:
    # Versions are pinned exactly, and the embedded CLI is fetched from npm: a rotted one turns this red on its own.
    - cron: '0 6 * * 1'

jobs:
  checks:
    # The three systems the Desktop runs on. Ubuntu is also where Docker runs Linux containers, so the database tests
    # actually run somewhere; Windows runners have a Windows-only engine, and those tests skip there.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      # `pnpm test` embeds the pinned CLI first, then runs against real processes and that CLI. The token is for the
      # GitHub Releases test: unauthenticated, its rate limit is per address, which runners share.
      - run: pnpm test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  packaged:
    # The path a user actually takes: a packaged app, opened with the PATH an app opened from Finder receives.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The packaged app reads the PATH of a login shell, as it does when opened from Finder. On a runner, pnpm
      # lives only in the job's environment and node only in the tool cache, so both are linked into /usr/local/bin,
      # which is on every login shell's PATH, the way a developer machine has them.
      - name: Put pnpm and node where a login shell finds them
        run: |
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          # pnpm's own launcher resolves paths from where it sits, so it is called through a wrapper, not linked.
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$(command -v pnpm)" | sudo tee /usr/local/bin/pnpm > /dev/null
          sudo chmod +x /usr/local/bin/pnpm
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin zsh -lc 'node --version && pnpm --version'
      - run: pnpm install
      - run: pnpm smoke

  packaged-linux:
    # The same path on Linux, from the package a user installs: the deb and the rpm the release ships, made and read
    # back, then the deb installed and its app run under a virtual display with the bare system PATH, which it must
    # extend from the login shell as fix-path does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install what the makers and the virtual display need
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      # On a runner node and pnpm live in the tool cache, on the job's PATH only. A developer's machine puts them on
      # the login shell's PATH, through nvm or a profile line; so does this, and the app must find them there.
      - name: Put pnpm and node where a login shell finds them
        run: |
          profile="$HOME/.profile"
          [ -f "$HOME/.bash_profile" ] && profile="$HOME/.bash_profile"
          echo "export PATH=\"$(dirname "$(command -v node)"):$(dirname "$(command -v pnpm)"):\$PATH\"" >> "$profile"
          env -i HOME="$HOME" PATH=/usr/bin:/bin bash -ilc 'node --version && pnpm --version'
      - run: pnpm install
      # Made and installed as a user does: the deb puts the app in /usr/lib and its binary on PATH, and makes
      # chrome-sandbox setuid root, which Chromium's sandbox needs where Ubuntu restricts user namespaces.
      - name: Make the deb and the rpm, and read them back
        run: |
          pnpm prepare-run
          pnpm exec electron-forge make
          deb="$(find out/make -name '*.deb')"
          rpm="$(find out/make -name '*.rpm')"
          echo "$deb" "$rpm"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/bin/prumo-desktop|prumo-desktop.desktop'
          rpm -qip "$rpm"
          rpm -qlp "$rpm" | grep -E 'usr/bin/prumo-desktop|prumo-desktop.desktop'
      - name: Install the deb
        run: sudo apt-get install -y "./$(find out/make -name '*.deb')"
      - run: xvfb-run -a node scripts/smoke.mjs
        env:
          SMOKE_BINARY: /usr/bin/prumo-desktop
