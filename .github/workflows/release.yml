name: Release

# A push to main whose package.json version has no GitHub release yet becomes one: the app is built for Apple
# silicon (arm64) and Intel (x64), signed with the Developer ID, notarized, packaged as a dmg and a zip per arch, and
# published as a draft. update.electronjs.org serves each Mac the zip whose name carries its arch. A person publishes the draft on
# GitHub; only then does update.electronjs.org offer it to installed apps.
#
# Secrets it needs, all from the Apple Developer account:
#   APPLE_CERTIFICATE           the Developer ID Application certificate, exported as .p12, base64-encoded
#   APPLE_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   APPLE_ID                    the Apple ID that notarizes
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               the team the certificate belongs to
# Without them the job says so and stops: an unsigned build would never update itself.
#
# It can also be started by hand (Actions > Release > Run workflow) on main, for the version main already holds:
# the first release after the secrets are added needs no new commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # A run started by hand on another branch would release code that never went through dev and alpha.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether this version needs a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING: >-
            ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' &&
            secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version already has a release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_SIGNING" != "true" ]; then
            echo "::warning::v$version is not released: one or more of the five Apple Developer ID secrets is not set."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.release == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.decide.outputs.release == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.decide.outputs.release == 'true'
        run: pnpm install

      # A keychain of its own for this job, holding only the certificate, unlocked for codesign.
      - name: Import the Developer ID certificate
        if: steps.decide.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # `pnpm release` in two halves, so nothing is uploaded before the signature and the ticket are checked.
      - name: Sign, notarize and make
        if: steps.decide.outputs.release == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # One arch at a time, each in its own folder: see outDir in forge.config.js.
        run: |
          pnpm prepare-run
          for arch in arm64 x64; do
            FORGE_OUT_DIR="out/$arch" pnpm exec electron-forge publish --dry-run --arch="$arch"
          done

      # What Gatekeeper will judge on a user's Mac: a valid Developer ID signature, notarized, with the ticket stapled.
      - name: Check the signature and the notarization
        if: steps.decide.outputs.release == 'true'
        run: |
          checked=0
          while IFS= read -r app; do
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier|flags'
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
            echo "::endgroup::"
            checked=$((checked + 1))
          done < <(find out/arm64 out/x64 -maxdepth 2 -name '*.app' -type d)
          # One app per arch: arm64 and x64.
          test "$checked" -eq 2

      - name: Publish the draft
        if: steps.decide.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Both go to the same draft: the publisher finds the release the first one created by its tag.
        run: |
          for arch in arm64 x64; do
            FORGE_OUT_DIR="out/$arch" pnpm exec electron-forge publish --from-dry-run
          done

      - name: Remove the signing keychain
        if: always() && steps.decide.outputs.release == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
