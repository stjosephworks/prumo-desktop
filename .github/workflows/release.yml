name: Release

# A push to main whose package.json version has no GitHub release yet becomes one draft, holding every system's
# build, which a person then publishes:
#
#   macos    Apple silicon (arm64) and Intel (x64), a dmg and a zip per arch. update.electronjs.org serves each Mac
#            the zip whose name carries its arch.
#   linux    x64, a deb and an rpm, unsigned.
#   windows  x64, a Squirrel.Windows Setup.exe with the nupkg and RELEASES Squirrel updates from, unsigned.
#   publish  waits for all three, then creates the draft with every file and its notes. One job creates it, so no two
#            runners race to make the same release.
#
# How the macOS build is signed depends only on which secrets exist; adding them is the whole switch, no code changes:
#
#   all five  Developer ID: signed with the certificate, Hardened Runtime, notarized and stapled, checked with
#             codesign, spctl and stapler.
#   none      Ad-hoc: signed with `codesign --sign -`, not notarized; the notes (.github/release-notes/unsigned.md)
#             explain macOS's Open Anyway.
#   some      The job fails and names what is missing: a typo must never ship an unsigned build quietly.
#
# The release is a pre-release while the macOS build is ad-hoc, and a normal release once it is signed with a
# Developer ID, so update.electronjs.org serves it to installed Macs (it never serves a pre-release). The Linux
# packages and the Windows Setup.exe are unsigned either way, and the notes say so (build/signing.cjs, prerelease). Every build that does not update itself
# says when a newer release exists (src/main/updates.ts).
#
# The secrets, all from the Apple Developer account:
#   APPLE_CERTIFICATE           the Developer ID Application certificate, exported as .p12, base64-encoded
#   APPLE_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   APPLE_ID                    the Apple ID that notarizes
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               the team the certificate belongs to
#
# A version is released once: the first signed release needs a version with no release yet, and people on an ad-hoc
# build install it by hand, once.
#
# Before publishing a signed draft, a person checks what the job cannot: download each dmg from the draft onto a Mac
# that has never run Prumo Desktop (one Apple silicon, one Intel or under Rosetta), open it, drag the app to
# Applications and launch it. Gatekeeper must open it without a warning; only the app inside the dmg is notarized and
# stapled, the dmg itself is not signed.
#
# It can also be started by hand (Actions > Release > Run workflow) on main, for the version main already holds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decide:
    # A run started by hand on another branch would release code that never went through dev and staging.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      mode: ${{ steps.decide.outputs.mode }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether this version needs a release, and how macOS is signed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # Whether each secret exists, never its value.
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          set_=() missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            flag="HAS_$name"
            if [ "${!flag}" = "true" ]; then set_+=("$name"); else missing+=("$name"); fi
          done

          if [ "${#set_[@]}" -eq 5 ]; then
            mode=developer-id
          elif [ "${#set_[@]}" -eq 0 ]; then
            mode=ad-hoc
          else
            echo "::error::Signing needs all five Apple secrets, or none for an ad-hoc pre-release. Set: ${set_[*]}. Missing: ${missing[*]}."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version already has a release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version will be released; macOS signed $mode."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install

      # A keychain of its own for this job, holding only the certificate, unlocked for codesign.
      - name: Import the Developer ID certificate
        if: needs.decide.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # build/signing.cjs reads the same three variables: empty, as GitHub passes a missing secret, means ad-hoc.
      - name: Sign, notarize when signed with a Developer ID, and make
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # One arch at a time, each in its own folder: see outDir in forge.config.js.
        run: |
          pnpm prepare-run
          for arch in arm64 x64; do
            FORGE_OUT_DIR="out/$arch" pnpm exec electron-forge make --arch="$arch"
          done

      # Every app is checked: its whole bundle signed, and, with a Developer ID, what Gatekeeper will judge on a user's
      # Mac: the Developer ID authority, notarized, with the ticket stapled.
      - name: Check the signatures
        env:
          MODE: ${{ needs.decide.outputs.mode }}
        run: |
          checked=0
          while IFS= read -r app; do
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "$MODE" = "developer-id" ]; then
              codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier|flags'
              spctl --assess --type execute --verbose=4 "$app"
              xcrun stapler validate "$app"
            else
              codesign --display --verbose=2 "$app" 2>&1 | grep -x 'Signature=adhoc'
            fi
            echo "::endgroup::"
            checked=$((checked + 1))
          done < <(find out/arm64 out/x64 -maxdepth 2 -name '*.app' -type d)
          # One app per arch: arm64 and x64.
          test "$checked" -eq 2

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            out/*/make/**/*.dmg
            out/*/make/**/*.zip
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && needs.decide.outputs.mode == 'developer-id'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  linux:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The rpm maker needs rpmbuild; dpkg and fakeroot, which the deb maker needs, come with the runner.
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install
      - name: Make the deb and the rpm
        run: |
          pnpm prepare-run
          pnpm exec electron-forge make --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error

  windows:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Make the Setup.exe
        run: |
          pnpm prepare-run
          pnpm exec electron-forge make --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/make/squirrel.windows/x64/*
          if-no-files-found: error

  publish:
    needs: [decide, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft with every build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
          MODE: ${{ needs.decide.outputs.mode }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ "$MODE" = "ad-hoc" ]; then
            sed "s/<version>/$VERSION/g" .github/release-notes/unsigned.md >> "$notes"
            echo >> "$notes"
          fi
          sed "s/<version>/$VERSION/g" .github/release-notes/linux.md >> "$notes"
          echo >> "$notes"
          sed "s/<version>/$VERSION/g" .github/release-notes/windows.md >> "$notes"

          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find dist -type f -print0)
          printf '%s\n' "${files[@]}"
          # Two Macs, a dmg and a zip each; a deb and an rpm; a Setup.exe, its nupkg and RELEASES.
          test "${#files[@]}" -eq 9

          # A pre-release while macOS is ad-hoc, a normal release once it is signed (build/signing.cjs).
          kind=()
          if [ "$(node -p "require('./build/signing.cjs').prerelease(process.argv[1])" "$MODE")" = "true" ]; then
            kind=(--prerelease)
          fi

          gh release create "v$VERSION" "${files[@]}" \
            --draft "${kind[@]}" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$notes"
