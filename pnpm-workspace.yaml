# Electron Forge packages node_modules as npm lays them out; pnpm's symlinked store breaks that.
nodeLinker: hoisted
# @electron/rebuild (used by Forge) depends on @electron/node-gyp straight from a git repository.
blockExoticSubdeps: false
# electron downloads its binary; node-pty picks a prebuild or compiles; fs-xattr and macos-alias are native parts of
# appdmg, which the dmg maker uses to lay out the disk image.
allowBuilds:
  electron: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
